name: CI

on:
  push:
    branches: [main]
    paths: ["evidenceqa/**"]
  pull_request:
    paths: ["evidenceqa/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidenceqa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
        env:
          EVIDENCEQA_ANSWER_PROVIDER: template
