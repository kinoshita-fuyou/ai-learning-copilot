name: CI

on:
  push:
    branches: [main]
    paths: ["evidenceqa/**", "reportflow/**"]
  pull_request:
    paths: ["evidenceqa/**", "reportflow/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [evidenceqa, reportflow]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
        env:
          EVIDENCEQA_ANSWER_PROVIDER: template
          REPORTFLOW_AGENT: rule
