services:
  evidenceqa:
    build: .
    container_name: evidenceqa
    ports:
      - "8001:8001"
    volumes:
      - evidenceqa-data:/data
    environment:
      EVIDENCEQA_DB_PATH: /data/evidenceqa.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  evidenceqa-data:
